apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogos-trainer
  namespace: dialogos-trainer
  labels:
    app: dialogos-trainer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dialogos-trainer
  template:
    metadata:
      labels:
        app: dialogos-trainer
    spec:
      containers:
        - name: dialogos-trainer
          image: ghcr.io/nord1441/dialogos-trainer:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dialogos-trainer-config
            - secretRef:
                name: dialogos-trainer-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dialogos-trainer-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dialogos-trainer-data
  namespace: dialogos-trainer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
